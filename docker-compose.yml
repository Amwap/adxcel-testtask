services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    volumes:
      # CSV sources and the SQLite database live on the host
      - ./backend/data:/app/data
      # backup_db.sh writes archives here
      - ./backend/backups:/app/backups
    # Only the host nginx (nginx/nginx.conf) talks to the containers
    ports:
      - "127.0.0.1:8341:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8340:4173"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
