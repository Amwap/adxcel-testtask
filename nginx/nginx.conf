# Host nginx site for adxcel.amwap.dev, linked into nginx (deploy.sh resets the repo, so edit this file, not the link):
#   sudo ln -sfn /home/adxcel/adxcel-testtask/nginx/nginx.conf /etc/nginx/sites-available/adxcel.amwap.dev.conf
#   sudo ln -sfn /etc/nginx/sites-available/adxcel.amwap.dev.conf /etc/nginx/sites-enabled/adxcel.amwap.dev.conf
#   sudo nginx -t && sudo systemctl reload nginx
# Upstream ports are published on 127.0.0.1 by docker-compose.yml.
# Certificate: sudo certbot certonly --nginx -d adxcel.amwap.dev (renewed by certbot, config untouched)

server {
    listen 80;
    listen [::]:80;
    server_name adxcel.amwap.dev;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name adxcel.amwap.dev;

    ssl_certificate     /etc/letsencrypt/live/adxcel.amwap.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/adxcel.amwap.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        proxy_pass http://127.0.0.1:8341;
    }

    # Built SPA served by `vite preview` (frontend container)
    location / {
        proxy_pass http://127.0.0.1:8340;
    }
}
