# Single nginx config: serves the frontend build and proxies /api to the backend.
# Mounted into the nginx service; apply changes with `docker compose restart nginx`.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile          on;
    keepalive_timeout 65;
    client_max_body_size 10m;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Resolve backend at request time via Docker DNS, so nginx starts even if it is down.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;

        location /api/ {
            set $backend http://backend:8000;
            proxy_pass $backend;

            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
