# Single nginx config: proxies /api to the backend and everything else to the Vite dev server.
# Mounted into the nginx service; apply changes with `docker compose restart nginx`.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile          on;
    keepalive_timeout 65;
    client_max_body_size 10m;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Resolve upstreams at request time via Docker DNS, so nginx starts even if they are down.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # WebSocket upgrade for Vite HMR
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name _;

        location /api/ {
            set $backend http://backend:8000;
            proxy_pass $backend;

            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            set $frontend http://frontend:5173;
            proxy_pass $frontend;

            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host       $host;
            proxy_read_timeout 1h;
        }
    }
}
