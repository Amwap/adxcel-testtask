# Host nginx site for adxcel.amwap.dev. Link it from the host nginx:
#   sudo ln -s "$PWD/nginx/nginx.conf" /etc/nginx/sites-enabled/adxcel.amwap.dev.conf
#   sudo nginx -t && sudo systemctl reload nginx
# Upstream ports are published on 127.0.0.1 by docker-compose.yml.

server {
    listen 80;
    listen [::]:80;
    server_name adxcel.amwap.dev;

    client_max_body_size 10m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        proxy_pass http://127.0.0.1:8341;
    }

    # Built SPA served by `vite preview` (frontend container)
    location / {
        proxy_pass http://127.0.0.1:8340;
    }
}
